name: GitHub Actions Quota Monitor

on:
  schedule:
    # 每週日 14:00 UTC（台灣時間 22:00）
    - cron: '0 14 * * 0'
  workflow_dispatch:

jobs:
  check-quota:
    runs-on: ubuntu-latest
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    steps:
      - name: Check GitHub Actions quota
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $PERSONAL_ACCESS_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${{ github.repository_owner }}/settings/billing/actions")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          if [ "$HTTP_CODE" != "200" ]; then
            curl -s -X POST https://api.line.me/v2/bot/message/push \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
              -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ 配額查詢失敗\n請確認 PERSONAL_ACCESS_TOKEN 是否有效\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"
            exit 1
          fi

          USED=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['total_minutes_used'])")
          TOTAL=2000
          PCT=$(python3 -c "print(round($USED / $TOTAL * 100))")

          echo "GitHub Actions 本月已用：$USED / $TOTAL 分鐘（${PCT}%）"

          if [ "$USED" -ge 1800 ]; then
            curl -s -X POST https://api.line.me/v2/bot/message/push \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
              -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"🚨 GitHub Actions 配額緊急警告\n📊 本月已用：$USED / $TOTAL 分鐘（${PCT}%）\n⚡ 請立即切換 runner: self-hosted\n操作：GitHub Actions UI → Run workflow → runner: self-hosted\n🔗 https://github.com/${{ github.repository }}/actions/workflows/etf_daily.yml\"}]}"
          elif [ "$USED" -ge 1600 ]; then
            curl -s -X POST https://api.line.me/v2/bot/message/push \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
              -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ GitHub Actions 配額警告\n📊 本月已用：$USED / $TOTAL 分鐘（${PCT}%）\n💡 建議手動觸發時切換 runner: self-hosted\"}]}"
          else
            echo "配額正常，不發通知。"
          fi

      - name: Notify LINE on failure
        if: failure()
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"🚨 配額監控 CI 失敗\n請手動至 GitHub Actions 查看\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"
