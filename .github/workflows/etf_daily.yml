name: Daily ETF Tracker

on:
  schedule:
    # 每天執行三次：
    # 台灣時間 22:00 (UTC 14:00): 每日一次收盤後更新
    - cron: '0 14 * * *'
  workflow_dispatch: # 允許手動觸發
    inputs:
      runner:
        description: '執行環境'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options: ['ubuntu-latest', 'self-hosted']

concurrency:
  group: etf-daily
  cancel-in-progress: false  # 若已在跑，新觸發排隊等待而非同時執行

jobs:
  validate-registry:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Validate registry sync
        run: uv run python ETF/scripts/validate_registry_sync.py

      - name: Notify LINE on failure
        if: failure()
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"🚨 ETF CI 失敗\n📅 $(date +%Y-%m-%d)\n🔧 Job: validate-registry\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"

  run-tracker:
    needs: validate-registry
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    env:
      # 設定環境變數，對應 GitHub Secrets
      FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      # Python Storage requires Service Role Key for REST API
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # LINE Messaging API Creds
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      # Stock Bot (Effective since 2026-02-08)
      STOCK_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.STOCK_LINE_CHANNEL_ACCESS_TOKEN }}
      STOCK_LINE_USER_ID: ${{ secrets.STOCK_LINE_USER_ID }}
      # AI API Key
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      # 確保時區正確
      TZ: 'Asia/Taipei'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ensure FinLab cache dir exists
        run: mkdir -p ~/.finlab

      - name: Cache Finlab Data
        uses: actions/cache@v5
        with:
          path: ~/.finlab
          # Reset cache key to v2 to clear potential bloat (>5GB issue)
          key: ${{ runner.os }}-finlab-tracker-v2
          restore-keys: |
            ${{ runner.os }}-finlab-tracker-

      - name: Install dependencies
        run: uv sync

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install chromium

      - name: Run ETF Tracker
        run: |
          # ETF 持股爬取 + diff 計算 + LINE 推播
          uv run python ETF/main.py --days 30
          # 量化策略選股信號（寫入 strategy_signals）
          uv run python ETF/run_strategies.py --days 5

      - name: Upload ETF History Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: etf-history-csv
          path: ETF/history/*.csv
          retention-days: 7

      - name: Notify LINE on failure
        if: failure()
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"🚨 ETF CI 失敗\n📅 $(date +%Y-%m-%d)\n🔧 Job: run-tracker\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"
