name: Daily ETF Tracker

on:
  schedule:
    # 台灣時間 20:00 (UTC 12:00): 收盤後 FinLab 資料更新完畢
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: '執行環境'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options: ['ubuntu-latest', 'self-hosted']
      rerun_round:
        description: '自動重跑輪次（0=初次執行，1-2=故障重跑）'
        required: false
        default: '0'
      delay_minutes:
        description: '啟動前等待分鐘數（重跑時用於避開 API rate limit）'
        required: false
        default: '0'

# 同一時間只允許一個執行實例；schedule 與手動觸發共用同一 concurrency group。
# 重跑 job 會等待前一個實例結束，不會互相取消。
concurrency:
  group: etf-daily
  cancel-in-progress: false

permissions:
  contents: write
  actions: write  # 讓 GITHUB_TOKEN 可以觸發 workflow_dispatch（自動重跑用）

jobs:
  validate-registry:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Validate registry sync
        run: uv run python ETF/scripts/validate_registry_sync.py

      - name: Notify LINE on failure
        if: failure()
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"🚨 ETF CI 失敗\n📅 $(date +%Y-%m-%d)\n🔧 Job: validate-registry\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"

  run-tracker:
    needs: validate-registry
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash

    env:
      # FinLab 新版 Firebase 認證（取代舊的 api_token）
      FINLAB_REFRESH_TOKEN: ${{ secrets.FINLAB_REFRESH_TOKEN }}
      FINLAB_SESSION_ID: ${{ secrets.FINLAB_SESSION_ID }}
      FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      # Python Storage requires Service Role Key for REST API
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # LINE Messaging API Creds
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      # Stock Bot (Effective since 2026-02-08)
      STOCK_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.STOCK_LINE_CHANNEL_ACCESS_TOKEN }}
      STOCK_LINE_USER_ID: ${{ secrets.STOCK_LINE_USER_ID }}
      # AI API Key
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      # 確保時區正確
      TZ: 'Asia/Taipei'

    steps:
      - name: Delay startup (rate limit management)
        if: ${{ github.event.inputs.delay_minutes != '' && github.event.inputs.delay_minutes != '0' }}
        run: |
          echo "Waiting ${{ github.event.inputs.delay_minutes }} minute(s) before starting..."
          sleep $(( ${{ github.event.inputs.delay_minutes }} * 60 ))

      - name: Log rerun context
        run: |
          echo "=== ETF Daily Tracker ==="
          echo "Rerun round : ${{ github.event.inputs.rerun_round || '0' }}"
          echo "Runner      : ${{ github.event.inputs.runner || 'ubuntu-latest' }}"
          echo "Triggered by: ${{ github.event_name }}"
          echo "=========================="

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ensure FinLab cache dir exists
        run: mkdir -p ~/.finlab

      - name: Cache Finlab Data
        uses: actions/cache@v5
        with:
          path: ~/.finlab
          # Reset cache key to v2 to clear potential bloat (>5GB issue)
          key: ${{ runner.os }}-finlab-tracker-v2
          restore-keys: |
            ${{ runner.os }}-finlab-tracker-

      - name: Install dependencies
        run: uv sync

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install chromium

      - name: Run ETF Tracker
        run: |
          # ETF 持股爬取 + diff 計算 + LINE 推播
          # 量化策略選股信號由 main.py 的 StrategySignalStep 擔任每日唯一寫入者
          uv run python ETF/main.py --days 30

      - name: Upload ETF History Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: etf-history-csv
          path: ETF/history/*.csv
          retention-days: 7

      - name: Notify LINE on failure
        if: failure()
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"🚨 ETF CI 失敗\n📅 $(date +%Y-%m-%d)\n🔧 Job: run-tracker\n🔁 重跑輪次: ${{ github.event.inputs.rerun_round || '0' }}\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"

      - name: Auto-rerun on failure (max 2 rounds)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_ROUND="${{ github.event.inputs.rerun_round || '0' }}"
          MAX_ROUNDS=2

          if [ "$CURRENT_ROUND" -lt "$MAX_ROUNDS" ]; then
            NEXT_ROUND=$(( CURRENT_ROUND + 1 ))
            echo "Pipeline failed at round $CURRENT_ROUND. Scheduling rerun round $NEXT_ROUND in 30 minutes..."
            gh workflow run etf_daily.yml \
              --ref "${{ github.ref_name }}" \
              --field rerun_round="$NEXT_ROUND" \
              --field delay_minutes="30" \
              --field runner="${{ github.event.inputs.runner || 'ubuntu-latest' }}"
            echo "✅ Rerun round $NEXT_ROUND scheduled."
          else
            echo "❌ Reached max reruns ($MAX_ROUNDS). Manual intervention required."
          fi
