name: Daily ETF Tracker

on:
  schedule:
    # 每天執行兩次：
    # 1. 台灣時間 22:00 (UTC 14:00): 確保取得當日盤後完整資料
    # 2. 台灣時間 08:00 (UTC 00:00): 隔日開盤前再次確認 (Double Check)
    - cron: '0 0,14 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    
    env:
      # 設定環境變數，對應 GitHub Secrets
      FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      # Python Storage requires Service Role Key for REST API
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # LINE Messaging API Creds
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      # 確保時區正確
      TZ: 'Asia/Taipei'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Cache Finlab Data
        uses: actions/cache@v4
        with:
          path: ~/.finlab
          # 採用更穩定的 Key，避免因服務程式碼微調就重新下載數百 MB 資料
          key: ${{ runner.os }}-finlab-v1
          restore-keys: |
            ${{ runner.os }}-finlab-

      - name: Install dependencies
        run: uv sync

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install chromium

      - name: Run ETF Tracker
        run: |
          # 預設同步最近 30 天數據即可，節省每日執行時間
          uv run python ETF/main.py --days 30
          uv run python ETF/sync_stock_financials.py --days 30
