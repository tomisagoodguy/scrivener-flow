name: "ETF Tracker: 00981A"

on:
  schedule:
    # Run daily at 20:00 CST (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  track-etf:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so we can push back
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache Finlab Data
        uses: actions/cache@v4
        with:
          path: ~/.finlab
          key: ${{ runner.os }}-finlab-${{ hashFiles('**/ETF/*.py') }}
          restore-keys: |
            ${{ runner.os }}-finlab-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" 

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run ETF Tracker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
        run: uv run python ETF/main.py

      - name: Commit and Push History
        run: |
          git config --global user.name "ETF Tracker Bot"
          git config --global user.email "bot@scrivener-flow.com"
          
          # Add only CSV files, ignore others
          git add ETF/history/*.csv || true
          
          # Commit only if there are changes staged
          if ! git diff --cached --quiet; then
            git commit -m "data(etf): auto archive 00981A [skip ci]"
            git pull --rebase origin master
            git push origin master
          else
            echo "No CSV changes to commit. Skipping."
          fi
