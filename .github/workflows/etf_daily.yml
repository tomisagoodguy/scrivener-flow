name: Daily ETF Tracker

on:
  schedule:
    # 每天執行三次：
    # 台灣時間 22:00 (UTC 14:00): 每日一次收盤後更新
    - cron: '0 14 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    env:
      # 設定環境變數，對應 GitHub Secrets
      FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      # Python Storage requires Service Role Key for REST API
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # LINE Messaging API Creds
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      # Stock Bot (Effective since 2026-02-08)
      STOCK_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.STOCK_LINE_CHANNEL_ACCESS_TOKEN }}
      STOCK_LINE_USER_ID: ${{ secrets.STOCK_LINE_USER_ID }}
      # AI API Key
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      # 確保時區正確
      TZ: 'Asia/Taipei'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ensure FinLab cache dir exists
        run: mkdir -p ~/.finlab

      - name: Cache Finlab Data
        uses: actions/cache@v5
        with:
          path: ~/.finlab
          # Reset cache key to v2 to clear potential bloat (>5GB issue)
          key: ${{ runner.os }}-finlab-tracker-v2
          restore-keys: |
            ${{ runner.os }}-finlab-tracker-

      - name: Install dependencies
        run: uv sync

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install chromium

      - name: Run ETF Tracker
        run: |
          # 預設同步最近 30 天數據即可，節省每日執行時間
          uv run python ETF/main.py --days 30
          # sync_stock_financials 用 60 天，確保抓到剛公布的月營收（台灣上市公司月初 10 日截止）
          uv run python ETF/sync_stock_financials.py --days 60
          # Run AI Analysis Report
          uv run python ETF/daily_ai_report.py

      - name: Upload ETF History Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: etf-history-csv
          path: ETF/history/*.csv
          retention-days: 7
