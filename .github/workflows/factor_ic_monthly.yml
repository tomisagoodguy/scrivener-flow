name: Monthly Factor IC Computation

on:
  schedule:
    # 每月 1–5 日且為週一，UTC 15:00（台灣 23:00）
    - cron: '0 15 1-5 * 1'
  workflow_dispatch:
    inputs:
      month:
        description: '指定月份 YYYY-MM（留空為當月）'
        required: false
        default: ''

jobs:
  compute-ic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Compute Factor IC
        env:
          FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          MONTH_FLAG=""
          if [ -n "${{ github.event.inputs.month }}" ]; then MONTH_FLAG="--month ${{ github.event.inputs.month }}"; fi
          uv run python ETF/compute_factor_ic.py $MONTH_FLAG

      - name: Notify LINE on failure
        if: failure()
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"🚨 Factor IC 計算失敗\n📅 $(date +%Y-%m-%d)\n🔧 Job: compute-ic\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"
