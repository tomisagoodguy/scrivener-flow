name: Daily Equity Distribution Sync

on:
  schedule:
    # 台灣時間 23:00（UTC 15:00），待 etf_financials 完成後再跑
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: '執行環境'
        required: false
        default: 'ubuntu-latest'
        type: choice
        options: ['ubuntu-latest', 'self-hosted']

concurrency:
  group: etf-equity-daily
  cancel-in-progress: false

jobs:
  sync-equity-daily:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    env:
      FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      TZ: 'Asia/Taipei'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ensure FinLab cache dir exists
        run: mkdir -p ~/.finlab

      - name: Cache Finlab Data
        uses: actions/cache@v5
        with:
          path: ~/.finlab
          key: ${{ runner.os }}-finlab-equity-daily-v1
          restore-keys: |
            ${{ runner.os }}-finlab-equity-daily-

      - name: Install dependencies
        run: uv sync

      - name: Sync equity distribution
        run: |
          # 補入當日新增成分股的大戶籌碼（多數日子無新股 → 秒退）
          uv run python ETF/sync_equity_distribution.py

      - name: Notify LINE on failure
        if: failure()
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"🚨 Equity Daily Sync 失敗\n📅 $(date +%Y-%m-%d)\n🔧 Job: sync-equity-daily\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"
