name: Weekly Equity Distribution Sync

on:
  schedule:
    # 每週六 14:00 UTC（台灣時間 22:00），TDCC 週五公告，週六晚上資料已可用
    - cron: '0 14 * * 6'
  workflow_dispatch:
    inputs:
      force:
        description: '強制覆蓋現有 snapshot_date（補欄位用）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      force_backfill:
        description: '強制重算所有歷史期數並 upsert（新增欄位後回填用，如 mid/whale_holder_pct）'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  equity-distribution:
    name: Sync Equity Distribution Stats
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    env:
      FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      TZ: 'Asia/Taipei'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ensure FinLab cache dir exists
        run: mkdir -p ~/.finlab

      - name: Cache FinLab Data
        uses: actions/cache@v4
        with:
          path: ~/.finlab
          key: ${{ runner.os }}-finlab-equity-v1
          restore-keys: |
            ${{ runner.os }}-finlab-equity-

      - name: Install dependencies
        run: uv sync

      - name: Sync equity distribution stats
        run: |
          if [ "${{ github.event.inputs.force_backfill }}" = "true" ]; then
            uv run python ETF/sync_equity_distribution.py --force-backfill
          else
            FORCE_FLAG=""
            if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
            uv run python ETF/sync_equity_distribution.py $FORCE_FLAG
          fi

      - name: Notify LINE on failure
        if: failure()
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"🚨 equity_weekly 失敗\n📅 $(date +%Y-%m-%d)\n🔧 Job: equity-distribution\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"

  shareholder-weekly:
    name: Sync Shareholder Weekly Data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    env:
      FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      TZ: 'Asia/Taipei'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Ensure FinLab cache dir exists
        run: mkdir -p ~/.finlab

      - name: Cache FinLab Data
        uses: actions/cache@v4
        with:
          path: ~/.finlab
          key: ${{ runner.os }}-finlab-shareholder-v1
          restore-keys: |
            ${{ runner.os }}-finlab-shareholder-

      - name: Install dependencies
        run: uv sync

      - name: Sync raw shareholder weekly data
        run: |
          # 週排程同步 stock_shareholder_weekly（原始集保分層數據）
          # --skip-broker：broker 資料日排程已同步，週排程跳過避免重複下載巨型資料集
          uv run python ETF/sync_stock_financials.py --days 14 --skip-broker

      - name: Notify LINE on failure
        if: failure()
        run: |
          curl -s -X POST https://api.line.me/v2/bot/message/push \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"🚨 equity_weekly 失敗\n📅 $(date +%Y-%m-%d)\n🔧 Job: shareholder-weekly\n🔗 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"
