name: Weekly Equity Distribution Sync

on:
  schedule:
    # 每週一 01:00 UTC（台灣時間 09:00），TDCC 週五公告，週一資料已可用
    - cron: '0 1 * * 1'
  workflow_dispatch: # 允許手動觸發

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      FINLAB_API_KEY: ${{ secrets.FINLAB_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TZ: 'Asia/Taipei'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Cache FinLab Data
        uses: actions/cache@v4
        with:
          path: ~/.finlab
          key: ${{ runner.os }}-finlab-equity-v1
          restore-keys: |
            ${{ runner.os }}-finlab-equity-

      - name: Install dependencies
        run: uv sync

      - name: Sync equity distribution stats
        run: uv run python ETF/sync_equity_distribution.py
