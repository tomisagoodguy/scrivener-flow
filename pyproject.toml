[project]
name = "scrivener-flow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "finlab>=1.5.7",
    "google-api-python-client>=2.188.0",
    "google-auth-httplib2>=0.3.0",
    "google-auth-oauthlib>=1.2.4",
    "google-generativeai>=0.8.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "playwright>=1.58.0",
    "psycopg2-binary>=2.9.11",
    "pydrive2>=1.21.3",
    "python-dotenv>=1.2.1",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.46",
    "ta-lib-everywhere>=1.0.1",
    "selenium>=4.41.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "python-dotenv>=1.2.1",
    "ruff>=0.15.0",
]

[tool.ruff]
# 指定原始碼目錄，幫助 Ruff 辨識 Package 根路徑
src = ["ETF"]

[tool.pyright]
# 指定 Pyright / Pylance 掃描的包含目錄
include = ["ETF", "scripts", "tests"]
# 允許專案根目錄作為 Import 的搜尋根目錄（ETF package 位於此）
extraPaths = ["."]
# 指定虛擬環境
venvPath = "."
venv = ".venv"
# 基礎型別檢查
typeCheckingMode = "basic"
reportMissingImports = true
